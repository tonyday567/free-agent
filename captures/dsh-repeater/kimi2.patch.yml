# Bounded dsh-repeater pilot: the existing KIMI2 access point, with no
# credential material in the patch or captures.
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      kimi2:
        displayName: Kimi Coding 2
        api: openai-completions
        baseURL: https://api.kimi.com/coding/v1
        apiKeyEnv: KIMI2_API_KEY
        defaultContextWindow: 1048576
        defaultMaxTokens: 32768
        models:
          - id: k3.1-pro
            contextWindow: 1048576
            maxTokens: 32768
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: kimi2
    model: k3.1-pro
- id: acp
  config:
    provider: kimi2
    model: k3.1-pro
- id: tool-web
  name: "@deepseek-ai/dsh-tool-web"
  disabled: true
- id: tool-subagent
  name: "@deepseek-ai/dsh-tool-subagent"
  disabled: true
- id: tool-subagent-fork
  name: "@deepseek-ai/dsh-tool-subagent"
  disabled: true
- id: tool-subagent-control
  name: "@deepseek-ai/dsh-tool-subagent-control"
  disabled: true
