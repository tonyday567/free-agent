# Mac-side overlay: ride the PC's ollama bench through the standing ssh
# tunnel (Mac localhost:11435 → PC localhost:11434, over tailscale). The
# provider block is re-declared whole — dsh patch merge is shallow at the
# provider level (the v2-sprawl lesson). The model pin and tool disables
# ride the base patch (ollama.patch.yml); a model choice is a further
# overlay. Requires the tunnel up and OLLAMA_API_KEY set (any value).
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      ollama:
        displayName: Ollama PC via tunnel
        api: openai-completions
        baseURL: http://localhost:11435/v1
        apiKeyEnv: OLLAMA_API_KEY
        defaultContextWindow: 16384
        defaultMaxTokens: 4096
        models:
          - id: qwen2.5:14b
            contextWindow: 16384
            maxTokens: 4096
          - id: qwen2.5-coder:7b
            contextWindow: 16384
            maxTokens: 4096
          - id: llama3.1:8b
            contextWindow: 16384
            maxTokens: 4096
          - id: deepseek-r1:8b
            contextWindow: 16384
            maxTokens: 4096
          - id: gemma4:12b-it-qat
            contextWindow: 16384
            maxTokens: 4096
          - id: qwen3.8:27b
            contextWindow: 16384
            maxTokens: 4096
