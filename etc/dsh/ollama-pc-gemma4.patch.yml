# Combined overlay for the PC seat through the tunnel: the
# ollama-pc.patch.yml provider re-declaration (Mac localhost:11435 ->
# PC localhost:11434) PLUS the gemma4:12b-it-qat model pin, in one
# file. free-agent dsh takes a single --dsh-model-patch, so the two
# overlays that ollama.patch.yml's header imagines layering separately
# are composed here instead. Requires the tunnel up and OLLAMA_API_KEY
# set (any value).
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      ollama:
        displayName: Ollama PC via tunnel
        api: openai-completions
        baseURL: http://localhost:11435/v1
        apiKeyEnv: OLLAMA_API_KEY
        defaultContextWindow: 16384
        defaultMaxTokens: 4096
        models:
          - id: qwen2.5:14b
            contextWindow: 16384
            maxTokens: 4096
          - id: qwen2.5-coder:7b
            contextWindow: 16384
            maxTokens: 4096
          - id: llama3.1:8b
            contextWindow: 16384
            maxTokens: 4096
          - id: deepseek-r1:8b
            contextWindow: 16384
            maxTokens: 4096
          - id: gemma4:12b-it-qat
            contextWindow: 16384
            maxTokens: 4096
          - id: gemma4-house
            contextWindow: 16384
            maxTokens: 4096
          - id: qwen3.8:27b
            contextWindow: 16384
            maxTokens: 4096
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: ollama
    model: gemma4-house
